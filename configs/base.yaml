# Shared settings for all experiments.
# An experiment file (B0.yaml, V1.yaml, ...) lists only the keys that differ.
# Values marked CHANGE_ME or null are filled in at the step named in the comment.

exp_id: base

data:
  # Dataset folder on Kaggle: GRAZPEDWRI-DX with the patient-level split of Ju et al.
  root: /kaggle/input/datasets/nithoukhan/grazpedwri-dx-aug/GRAZPEDWRI-DX
  meta_csv: dataset.csv
  # The split is defined by these three files. It is never re-generated.
  split_csvs:
    train: train_data.csv
    valid: valid_data.csv
    test: test_data.csv
  data_dir: data                         # holds images/<folder> and labels/<folder>
  folders:
    train: train_aug                     # originals (orig_*) and offline copies (aug_*)
    valid: valid
    test: test
  # File-name prefix -> variant. A name without a prefix is an original.
  variant_prefixes:
    orig_: orig
    aug_: aug
  # Projection code in dataset.csv -> view. Other codes become "other".
  views:
    1: ap
    2: lat
  # Totals the index must reproduce (base images = originals).
  expect:
    images: 20327
    train: 14204
    valid: 4094
    test: 2029
  index_csv: /kaggle/working/index.csv   # written by scripts/01_build_index.py
  # Saved copy of index.csv as a Kaggle Dataset, used when index_csv is absent
  # (building the index takes about 36 minutes on Kaggle).
  index_input: /kaggle/input/datasets/nithoukhan1/vgra-index/index.csv
  eda_dir: /kaggle/working/eda           # EDA tables as CSV
  pairs_csv: /kaggle/working/pairs.csv   # written by scripts/02_pair_audit.py
  # Gate 1 starting thresholds (STEP-02). The final decision is made by us.
  gate1:
    min_pair_image_share: 0.70           # share of base images that sit in a pair
    min_one_view_pairs_train: 100        # one-view-only training pairs a class needs
    min_one_view_share: 0.10             # ... and their share of pairs where the class is present
    min_classes: 3                       # classes that must meet both
  # Class order, verified against data/meta.yaml.
  classes:
    - boneanomaly
    - bonelesion
    - foreignbody
    - fracture
    - metal
    - periostealreaction
    - pronatorsign
    - softtissue
    - text
  # Classes VGRA acts on. To confirm in STEP-02.
  gateable:
    - fracture
    - periostealreaction
    - pronatorsign
    - softtissue
    - metal
    - boneanomaly

model:
  weights: yolo11s.pt
  scc: true            # SCC adapters in backbone layers 2 and 4
  vgra: "off"          # off | oracle | learned
  descriptor: cqp      # cqp | pooled | scores
  d_desc: 64
  vsh: shared          # shared | per_class
  gate: signed         # signed | unsigned | none
  gate_grad: detached  # detached | attached
  rank: 16
  cap: 2.0

loss:
  w_vis: 0.5
  w_pres: 0.25

train:
  imgsz: null          # set in STEP-03
  epochs: null         # set per stage in STEP-03 / STEP-09
  batch: null
  p_drop: 0.3          # partner dropout
  seeds: [0, 1, 2]

out_dir: /kaggle/working/runs
